```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SR University</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                linear-gradient(rgba(0, 45, 110, 0.8), rgba(0, 45, 110, 0.8)),
                url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .logo {
            text-align: center;
            color: #0b3d91;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #0b3d91;
            box-shadow: 0 0 5px rgba(11, 61, 145, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #0b3d91;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #06285f;
        }

        .forgot {
            text-align: right;
            margin: 10px 0 20px;
        }

        .forgot a {
            color: #0b3d91;
            text-decoration: none;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        .register {
            text-align: center;
            margin-top: 25px;
            color: #555;
        }

        .register a {
            color: #0b3d91;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #0b3d91;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 30px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">SR University</div>
        <p class="subtitle">Student Login</p>

        <form>

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="#">Register</a>
        </div>

        <div class="back-home">
            <a href="index.html">← Back to Home</a>
        </div>

    </div>

</body>
</html>
```
